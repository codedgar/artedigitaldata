<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obras - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <script src="js/config.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/avatar.js"></script>
  <script src="js/ui/badge.js"></script>
  <script src="js/ui/button.js"></script>
  <script src="js/ui/card.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/ui/heading.js"></script>
  <script src="js/ui/media.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/state.js"></script>
  <script src="js/ui/tabs.js"></script>
</head>
<body class="min-h-screen">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
  <div id="app-header"></div>

  <main class="relative z-10 pt-20 pb-10 max-w-7xl mx-auto px-4">
    <section id="page-header" class="mb-10"></section>
    <script>document.getElementById('page-header').innerHTML = UI.PageHeader({ icon: 'fas fa-palette', title: 'Galería de Obras', subtitle: 'Explorá el talento de la comunidad de artistas digitales.' });</script>

    <!-- Obras Grid -->
    <div id="obras-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <script>document.getElementById('obras-container').innerHTML = UI.LoadingState({ message: 'Cargando arte...' });</script>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script src="js/tagging.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadObras();
    });

    async function loadObras() {
      const container = document.getElementById('obras-container');
      try {
        const res = await fetch(CONFIG.API_URL + '/posts');
        const posts = await res.json();
        renderObras(posts);
      } catch {
        container.innerHTML = UI.ErrorState({ message: 'Error cargando obras' });
      }
    }


    function renderObras(posts) {
      const container = document.getElementById('obras-container');
      if (!posts.length) {
        container.innerHTML = UI.EmptyState({ icon: 'fas fa-image', message: 'Aún no hay obras publicadas' });
        return;
      }

      container.innerHTML = posts.map(p => UI.PostCard({ post: p, variant: 'gallery', youtubeId: extractYouTubeId(p) })).join('');
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
</body>
</html>
