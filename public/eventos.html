<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <script src="js/config.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/avatar.js"></script>
  <script src="js/ui/badge.js"></script>
  <script src="js/ui/button.js"></script>
  <script src="js/ui/card.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/ui/heading.js"></script>
  <script src="js/ui/media.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/state.js"></script>
  <script src="js/ui/tabs.js"></script>
</head>
<body class="min-h-screen">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
  <div id="app-header"></div>

  <main class="relative z-10 pt-20 pb-10 max-w-7xl mx-auto px-4">
    <section class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
      <div id="page-header"></div>
      <script>document.getElementById('page-header').innerHTML = UI.PageHeader({ icon: 'fas fa-calendar-star', title: 'Eventos de la Comunidad', subtitle: 'Publicá tus fechas, ferias, talleres y encuentros.', accent: 'magenta', size: 'lg' });</script>
      <a href="calendario.html" class="px-6 py-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-[var(--color-cyan)] font-bold hover:bg-cyan-500/20 transition-all flex items-center gap-2">
        <i class="fas fa-calendar-alt"></i> Ver Calendario
      </a>
    </section>

    <!-- Events Grid -->
    <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    <script>document.getElementById('events-container').innerHTML = UI.LoadingState({ message: 'Sincronizando eventos...', accent: 'magenta', size: 'xl' });</script>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadEvents();
    });


    async function loadEvents() {
      const container = document.getElementById('events-container');
      try {
        const res = await fetch(CONFIG.API_URL + '/eventos');
        const eventos = await res.json();
        
        if (!eventos.length) {
          container.innerHTML = UI.EmptyState({ icon: 'fas fa-calendar-times', message: 'No hay eventos programados próximamente.', accent: 'ghost', iconSize: 'xl' });
          return;
        }

        container.innerHTML = eventos.map(ev => UI.EventoCard({
          evento: ev, variant: 'gallery', youtubeId: extractYouTubeId(ev),
          canManage: isLoggedIn() && (ev.creator?._id === getUserId() || isAdmin()),
        })).join('');
      } catch (err) {
        container.innerHTML = UI.ErrorState({ message: 'Error cargando eventos', variant: 'plain' });
      }
    }

    async function deleteEvent(id) {
      if (!confirm('¿Seguro querés eliminar este evento?')) return;
      const res = await apiRequest(`/eventos/${id}`, { method: 'DELETE' });
      if (res?.ok) await loadEvents();
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
</body>
</html>
