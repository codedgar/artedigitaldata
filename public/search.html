<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <script src="js/config.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/avatar.js"></script>
  <script src="js/ui/badge.js"></script>
  <script src="js/ui/button.js"></script>
  <script src="js/ui/card.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/ui/heading.js"></script>
  <script src="js/ui/media.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/state.js"></script>
  <script src="js/ui/tabs.js"></script>
</head>
<body class="min-h-screen">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
  <div id="app-header" style="position: relative; z-index: 100;"></div>

  <main class="relative z-10 pt-24 pb-10 max-w-5xl mx-auto px-4">
    <div class="mb-10 text-center">
      <h1 class="text-4xl font-black gradient-text mb-4">Buscador Global</h1>
      <div class="relative max-w-2xl mx-auto">
        <input type="text" id="search-input" placeholder="Busca usuarios, obras, tags, eventos..." 
          class="w-full bg-white/5 border border-cyan-500/30 rounded-2xl px-6 py-4 text-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 transition-all shadow-lg shadow-cyan-500/10">
        <div class="absolute right-4 top-1/2 -translate-y-1/2 text-cyan-400">
          <i class="fas fa-search text-xl"></i>
        </div>
      </div>
    </div>

    <div id="results-sections" class="space-y-12">
      <!-- Results will be injected here -->
      <script>document.currentScript.outerHTML = UI.EmptyState({ id: 'initial-state', icon: 'fas fa-rocket', message: 'Escribe algo para empezar a explorar...', accent: 'ghost', layout: 'block' });</script>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script>
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('results-sections');
    let debounceTimer;

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();
      
      if (query.length < 2) {
        resultsContainer.innerHTML = UI.EmptyState({ id: 'initial-state', icon: 'fas fa-rocket', message: 'Escribe algo para empezar a explorar...', accent: 'ghost', layout: 'block' });
        return;
      }

      debounceTimer = setTimeout(() => performSearch(query), 300);
    });

    async function performSearch(query) {
      resultsContainer.innerHTML = UI.PageLoader({ message: 'Buscando en el metaverso...', accent: 'cyan', tone: 'soft' });

      try {
        const res = await fetch(`${CONFIG.API_URL}/tagging?q=${encodeURIComponent(query)}`);
        const results = await res.json();
        renderResults(results);
      } catch (err) {
        resultsContainer.innerHTML = UI.StatusText({ variant: 'error-line', message: 'Error al buscar' });
      }
    }

    function renderResults(results) {
      if (results.length === 0) {
        resultsContainer.innerHTML = UI.EmptyState({ icon: 'fas fa-ghost', message: 'No encontramos nada con ese nombre...', accent: 'ghost', layout: 'block' });
        return;
      }

      const users = results.filter(r => r.type === 'user');
      const posts = results.filter(r => r.type === 'post');
      const events = results.filter(r => r.type === 'event');
      const resources = results.filter(r => r.type === 'resource');

      let html = '';

      if (users.length) {
        html += `
          <section>
            <h2 class="ui-title ui-title--section mb-6 flex items-center gap-2">
              <i class="fas fa-users text-cyan-400"></i> Usuarios
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
              ${users.map(u => `
                <a href="profile.html?user=${u.id}" class="group p-4 rounded-2xl bg-white/5 border border-white/5 hover:border-cyan-500/30 transition-all text-center">
                  <div class="w-16 h-16 rounded-full mx-auto mb-3 overflow-hidden border-2 border-transparent group-hover:border-cyan-400 transition-all">
                    ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : `
                      <div class="w-full h-full bg-cyan-500/20 flex items-center justify-center text-cyan-400">
                        <i class="fas fa-user text-xl"></i>
                      </div>
                    `}
                  </div>
                  <div class="text-white font-bold text-sm truncate">${u.label}</div>
                  <div class="text-gray-500 text-xs truncate">@${u.id}</div>
                </a>
              `).join('')}
            </div>
          </section>`;
      }

      if (posts.length) {
        html += `
          <section>
            <h2 class="ui-title ui-title--section mb-6 flex items-center gap-2">
              <i class="fas fa-palette text-magenta-500"></i> Obras
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${posts.map(p => UI.PostCard({ post: p, variant: 'search', youtubeId: extractYouTubeId(p) })).join('')}
            </div>
          </section>`;
      }

      if (events.length) {
        html += `
          <section>
            <h2 class="ui-title ui-title--section mb-6 flex items-center gap-2">
              <i class="fas fa-calendar-star text-yellow-500"></i> Eventos
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${events.map(e => UI.EventoCard({ evento: e, variant: 'search', youtubeId: extractYouTubeId(e) })).join('')}
            </div>
          </section>`;
      }

      if (resources.length) {
        html += `
          <section>
            <h2 class="ui-title ui-title--section mb-6 flex items-center gap-2">
              <i class="fas fa-box-open text-cyan-400"></i> Recursos
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${resources.map(r => UI.RecursoCard({ recurso: r, variant: 'search' })).join('')}
            </div>
          </section>`;
      }

      resultsContainer.innerHTML = html;
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
</body>
</html>
