<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind.css">
  <script src="js/config.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/avatar.js"></script>
  <script src="js/ui/badge.js"></script>
  <script src="js/ui/button.js"></script>
  <script src="js/ui/card.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/ui/heading.js"></script>
  <script src="js/ui/media.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/state.js"></script>
  <script src="js/ui/tabs.js"></script>
</head>
<body class="min-h-screen">
  <div id="p5-global-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
  <div id="app-header"></div>

  <main class="relative z-10 pt-20 pb-10 max-w-5xl mx-auto px-4">
    <!-- Profile Header -->
    <div id="profile-header" class="rounded-2xl p-8 border border-cyan-500/20 mb-8 card-cyber">
      <div class="flex flex-col md:flex-row items-center gap-6">
        <div id="profile-avatar" class="w-24 h-24 rounded-full flex items-center justify-center text-3xl font-black shrink-0"
             style="background: var(--gradient-neon); color: #0a0a0f;">
          ?
        </div>
        <div class="flex-1 text-center md:text-left">
          <h1 id="profile-username" class="ui-title ui-title--page-xs">Cargando...</h1>
          <p id="profile-bio" class="text-gray-400 mt-2"></p>
          <p id="profile-meta" class="text-sm text-gray-500 mt-2"></p>
          <div id="profile-socials" class="flex flex-wrap gap-2 mt-4"></div>

          <!-- XP Level Bar (always shown) -->
          <div id="xp-level-bar" class="hidden mt-5 w-full">
            <div class="flex items-center justify-between mb-1">
              <span id="xp-level-label" class="text-xs font-black tracking-widest uppercase text-[var(--color-cyan)]"></span>
              <span id="xp-points-label" class="text-xs text-gray-500"></span>
            </div>
            <div class="w-full h-2 rounded-full bg-white/5 overflow-hidden">
              <div id="xp-bar-fill" class="h-full rounded-full bg-[var(--color-cyan)] transition-all duration-700" style="width:0%"></div>
            </div>
          </div>
        </div>
        <div id="edit-profile-btn" class="hidden mt-4 md:mt-0">
          <button onclick="toggleEditMode()" class="px-6 py-3 rounded-xl border border-cyan-500/30 text-[var(--color-cyan)] hover:bg-cyan-500/10 font-bold transition-all shadow-[0_0_20px_rgba(0,255,255,0.05)]">
            <i class="fas fa-edit mr-2"></i>Editar Perfil
          </button>
        </div>
      </div>

      <!-- Edit Form (hidden by default) -->
      <div id="edit-form" class="hidden mt-6 pt-6 border-t border-white/10">
        <form id="profile-edit-form" class="space-y-4">
          <div>
            <label class="ui-label ui-label--account">Email</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
              <input type="text" id="edit-email-display" readonly
                class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-gray-400 placeholder-gray-600 cursor-default select-all"
                placeholder="No disponible">
            </div>
            <p class="text-[11px] text-gray-600 mt-1">El email no es editable desde aquí.</p>
          </div>
          <div>
            <label class="ui-label ui-label--account">Nombre a Mostrar</label>
            <input type="text" id="edit-display-name" placeholder="Tu nombre artístico o real"
              class="ui-input ui-input--soft ui-input--focus-brand">
          </div>
          <div>
            <label class="ui-label ui-label--account">Bio</label>
            <textarea id="edit-bio" rows="3"
              class="ui-textarea ui-textarea--soft ui-textarea--focus-orange ui-textarea--fixed"
              placeholder="Contá sobre vos..."></textarea>
          </div>
          <div>
            <label class="ui-label ui-label--account">Avatar (URL o subir imagen)</label>
            <div class="flex gap-3">
              <input type="text" id="edit-avatar-url" placeholder="URL de imagen"
                class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:border-[var(--color-cyan)] focus:outline-none transition-colors">
              <input type="file" id="edit-avatar-file" accept="image/*"
                class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-gray-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-500/20 file:text-cyan-400 file:text-sm file:cursor-pointer">
            </div>
          </div>
          
          <div class="pt-6 border-t border-white/10 mt-6">
            <h3 class="ui-eyebrow ui-eyebrow--section mb-4">Conectar Redes Sociales</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="relative group">
                <i class="fab fa-instagram absolute left-4 top-1/2 -translate-y-1/2 text-pink-500 group-focus-within:scale-110 transition-transform"></i>
                <input type="text" id="edit-social-instagram" placeholder="@usuario_instagram" 
                  class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-gray-600 focus:border-pink-500/50 focus:outline-none transition-all">
              </div>
              <div class="relative group">
                <i class="fab fa-discord absolute left-4 top-1/2 -translate-y-1/2 text-indigo-400 group-focus-within:scale-110 transition-transform"></i>
                <input type="text" id="edit-social-discord" placeholder="Link de invitación o ID" 
                  class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-gray-600 focus:border-indigo-400/50 focus:outline-none transition-all">
              </div>
              <div class="relative group">
                <i class="fab fa-whatsapp absolute left-4 top-1/2 -translate-y-1/2 text-green-500 group-focus-within:scale-110 transition-transform"></i>
                <input type="text" id="edit-social-whatsapp" placeholder="Número (ej: 5411...)" 
                  class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-gray-600 focus:border-green-500/50 focus:outline-none transition-all">
              </div>
              <div class="relative group">
                <i class="fab fa-facebook absolute left-4 top-1/2 -translate-y-1/2 text-blue-600 group-focus-within:scale-110 transition-transform"></i>
                <input type="text" id="edit-social-facebook" placeholder="URL de tu perfil" 
                  class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-gray-600 focus:border-blue-600/50 focus:outline-none transition-all">
              </div>
              <div class="relative group">
                <i class="fab fa-tiktok absolute left-4 top-1/2 -translate-y-1/2 text-white group-focus-within:scale-110 transition-transform"></i>
                <input type="text" id="edit-social-tiktok" placeholder="@usuario_tiktok" 
                  class="w-full bg-white/5 border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white placeholder-gray-600 focus:border-white/50 focus:outline-none transition-all">
              </div>
            </div>
          </div>
          <button type="submit" class="btn-primary px-6 py-3 rounded-xl transition-all hover:scale-105">
            <i class="fas fa-save mr-2"></i>Guardar Cambios
          </button>
        </form>
      </div>
    </div>

    <!-- Profile Completion Widget (owner only, shown via JS) -->
    <div id="profile-completion-widget" class="hidden mb-6 rounded-2xl border border-yellow-500/20 bg-yellow-500/5 p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-black text-yellow-400 flex items-center gap-2">
          <i class="fas fa-star"></i> Completá tu perfil
        </h3>
        <button onclick="document.getElementById('profile-completion-widget').classList.add('hidden')" class="text-gray-600 hover:text-gray-400 text-xs transition-colors">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="w-full h-1.5 rounded-full bg-white/5 mb-3 overflow-hidden">
        <div id="completion-bar" class="h-full rounded-full bg-gradient-to-r from-yellow-500 to-orange-500 transition-all duration-700" style="width:0%"></div>
      </div>
      <div id="completion-tasks" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Tabs -->
    <div class="ui-tabs--underline mb-8 overflow-x-auto scrollbar-hide">
      <script>document.currentScript.outerHTML = UI.Tabs({ variant: 'underline', onSelect: 'switchTab', idPrefix: 'tab-', active: 'posts', items: [
        { key: 'posts', icon: 'fas fa-palette', label: 'OBRAS', badgeId: 'badge-posts', badgeTone: 'cyan' },
        { key: 'recursos', icon: 'fas fa-box-open', label: 'RECURSOS', badgeId: 'badge-recursos', badgeTone: 'orange' },
        { key: 'concursos', icon: 'fas fa-trophy', iconAccent: 'yellow', label: 'MIS IMAGENES', badgeId: 'badge-concursos', badgeTone: 'yellow' },
        { key: 'eventos', icon: 'fas fa-calendar-alt', label: 'EVENTOS', badgeId: 'badge-eventos', badgeTone: 'blue' },
        { key: 'oportunidades', icon: 'fas fa-briefcase', label: 'CHANCES', badgeId: 'badge-oportunidades', badgeTone: 'emerald' },
        { key: 'favs', icon: 'fas fa-heart', iconAccent: 'red', label: 'TUS FAV', badgeId: 'badge-favs', badgeTone: 'red' },
        { key: 'tickets', icon: 'fas fa-ticket-alt', iconAccent: 'fuchsia', label: 'ENTRADAS', badgeId: 'badge-tickets', badgeTone: 'fuchsia' },
        { key: 'visualeffects', icon: 'fas fa-wand-magic-sparkles', iconAccent: 'cyan', label: 'SECUENCIAS', badgeId: 'badge-visualeffects', badgeTone: 'cyan-soft' },
        { key: 'notificaciones', icon: 'fas fa-bell', iconAccent: 'yellow-soft', label: 'NOTIFICACIONES', badgeId: 'notif-badge', hidden: true },
      ] });</script>
    </div>

    <!-- Content Sections -->
    <div id="section-posts" class="content-section">
      <div id="user-posts" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <script>document.getElementById('user-posts').innerHTML = UI.LoadingState({ message: 'Cargando obras...', accent: 'orange', size: 'md' });</script>
    </div>

    <div id="section-recursos" class="content-section hidden">
      <div id="user-recursos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <script>document.getElementById('user-recursos').innerHTML = UI.LoadingText({ message: 'Cargando recursos...' });</script>
    </div>

    <div id="section-concursos" class="content-section hidden">
      <div id="user-concursos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <script>document.getElementById('user-concursos').innerHTML = UI.LoadingText({ message: 'Cargando tus imágenes del concurso...' });</script>
    </div>

    <div id="section-eventos" class="content-section hidden">
      <div id="user-eventos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <script>document.getElementById('user-eventos').innerHTML = UI.LoadingText({ message: 'Cargando eventos...' });</script>
    </div>

    <div id="section-oportunidades" class="content-section hidden">
      <div id="user-oportunidades" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <script>document.getElementById('user-oportunidades').innerHTML = UI.LoadingText({ message: 'Cargando oportunidades...' });</script>
    </div>

    <div id="section-favs" class="content-section hidden">
      <div id="user-favs" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <script>document.getElementById('user-favs').innerHTML = UI.LoadingText({ message: 'Cargando favoritos...' });</script>
    </div>

    <div id="section-tickets" class="content-section hidden">
      <div id="user-tickets" class="space-y-4"></div>
      <script>document.getElementById('user-tickets').innerHTML = UI.LoadingState({ message: 'Cargando entradas...', accent: 'fuchsia', size: 'md', layout: 'block' });</script>
    </div>

    <div id="section-visualeffects" class="content-section hidden">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <div>
          <h3 class="ui-title ui-title--section flex items-center gap-2">
            <i class="fas fa-wand-magic-sparkles text-cyan-400"></i> Mis Secuencias Guardadas
          </h3>
          <p class="text-xs text-gray-400 mt-1">Secuencias creadas desde Flyer Mode / Visual Effects</p>
        </div>
        <a href="visualeffects.html" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2 transition-all">
          <i class="fas fa-plus"></i> Crear Nueva Secuencia
        </a>
      </div>
      <div id="user-visualeffects" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <script>document.getElementById('user-visualeffects').innerHTML = UI.LoadingState({ message: 'Cargando secuencias...', size: 'md' });</script>
    </div>

    <div id="section-notificaciones" class="content-section hidden">
      <div class="flex items-center justify-between mb-6">
        <h2 class="ui-title ui-title--card-strong flex items-center gap-2">
          <i class="fas fa-bell text-yellow-400"></i> Notificaciones
        </h2>
        <button id="mark-all-read-btn" onclick="markAllNotificationsRead()" class="px-4 py-2 rounded-xl border border-white/10 text-gray-400 hover:text-white hover:bg-white/5 text-xs font-bold transition-all">
          <i class="fas fa-check-double mr-1"></i>Marcar todas como leídas
        </button>
      </div>
      <div id="user-notifications" class="space-y-3"></div>
      <script>document.getElementById('user-notifications').innerHTML = UI.LoadingState({ message: 'Cargando notificaciones...', accent: 'yellow', size: 'md', layout: 'block' });</script>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/tagging.js"></script>
  <script src="js/forms.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="js/edit-logic.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUsername = params.get('user');
    let currentUser = getUser();
    let isOwner = false;

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = getUser();

      if (!targetUsername) {
        if (isLoggedIn() && currentUser) {
          window.location.href = `profile?user=${currentUser.username}`;
        } else {
          showLogin();
        }
        return;
      }

      isOwner = !!(currentUser && currentUser.username &&
        currentUser.username.toLowerCase() === targetUsername.toLowerCase());

      if (isOwner) {
        document.getElementById('edit-profile-btn').classList.remove('hidden');
        document.getElementById('tab-notificaciones').classList.remove('hidden');
      }

      await loadProfile();

      document.getElementById('profile-edit-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        let avatar = document.getElementById('edit-avatar-url').value.trim();
        const bio = document.getElementById('edit-bio').value.trim();
        const displayName = document.getElementById('edit-display-name').value.trim();
        const file = document.getElementById('edit-avatar-file').files[0];

        if (file) {
          const formData = new FormData();
          formData.append('file', file);
          const uploadRes = await fetch(CONFIG.API_URL + '/upload', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${getToken()}` },
            body: formData
          });
          if (uploadRes.ok) {
            const data = await uploadRes.json();
            avatar = data.url;
          }
        }

        const socials = {
          instagram: document.getElementById('edit-social-instagram').value.trim(),
          discord: document.getElementById('edit-social-discord').value.trim(),
          whatsapp: document.getElementById('edit-social-whatsapp').value.trim(),
          facebook: document.getElementById('edit-social-facebook').value.trim(),
          tiktok: document.getElementById('edit-social-tiktok').value.trim()
        };

        const res = await apiRequest('/profile/me', {
          method: 'PATCH',
          body: JSON.stringify({ bio, avatar: avatar || undefined, displayName, socials })
        });

        if (res?.ok) {
          const updatedUser = await res.json();
          setUser({ ...currentUser, ...updatedUser });
          renderHeader();
          await loadProfile();
          toggleEditMode();
        }
      });
    });

    // Helper function to generate Google Maps URL
    function getGoogleMapsUrl(location) {
      if (!location) return '#';
      // If it's already a URL, return it
      if (location.startsWith('http')) return location;
      // Otherwise, create a Google Maps search URL
      const encoded = encodeURIComponent(location);
      return `https://www.google.com/maps/search/?api=1&query=${encoded}`;
    }

    async function loadProfile() {
      try {
        const headers = {};
        const tok = getToken();
        if (tok) headers['Authorization'] = `Bearer ${tok}`;
        const res = await fetch(CONFIG.API_URL + `/profile/${encodeURIComponent(targetUsername)}`, { headers });
        if (!res.ok) {
          document.getElementById('profile-username').textContent = 'Usuario no encontrado';
          return;
        }
        const data = await res.json();
        const profile = data.user;
        if (!profile) {
          document.getElementById('profile-username').textContent = 'Usuario no encontrado';
          return;
        }
        const posts = Array.isArray(data.posts) ? data.posts : [];
        const recursos = Array.isArray(data.recursos) ? data.recursos : [];
        const eventos = Array.isArray(data.eventos) ? data.eventos : [];
        const oportunidades = Array.isArray(data.oportunidades) ? data.oportunidades : [];
        const doorEvents = Array.isArray(data.doorEvents) ? data.doorEvents : [];
        const favorites = data.favorites || { posts: [], recursos: [], eventos: [], oportunidades: [] };
        const visualeffects = Array.isArray(data.visualeffects) ? data.visualeffects : [];

        document.getElementById('profile-username').textContent = profile.displayName || profile.username;
        const bioText = profile.bio || 'Sin bio';
        document.getElementById('profile-bio').innerHTML = typeof formatMentions === 'function' ? formatMentions(bioText) : bioText;
        document.getElementById('profile-meta').innerHTML = `
          <i class="fas fa-calendar-alt mr-1"></i> Se unió el ${new Date(profile.createdAt || Date.now()).toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' })}
          <span class="mx-2">•</span>
          <span class="px-2 py-0.5 rounded text-xs ${profile.role === 'ADMINISTRADOR' || profile.role === 'ADMIN' ? 'bg-cyan-500/20 text-[var(--color-cyan)] border border-cyan-500/30' : 'bg-white/10 text-gray-400'}">${profile.role || 'USUARIO'}</span>
        `;

        const avatarEl = document.getElementById('profile-avatar');
        if (profile.avatar) {
          avatarEl.innerHTML = `<img src="${sanitizeUrl(profile.avatar)}" class="w-24 h-24 rounded-full object-cover" alt="${escapeHTML(profile.displayName || profile.username)}">`;
        } else {
          avatarEl.textContent = (profile.displayName || profile.username || '?')[0].toUpperCase();
        }

        if (isOwner) {
          const emailDisplay = document.getElementById('edit-email-display');
          if (emailDisplay) emailDisplay.value = profile.email || 'No disponible';
          const dispName = document.getElementById('edit-display-name');
          if (dispName) dispName.value = profile.displayName || '';
          const bioEl = document.getElementById('edit-bio');
          if (bioEl) bioEl.value = profile.bio || '';
          const avUrl = document.getElementById('edit-avatar-url');
          if (avUrl) avUrl.value = profile.avatar || '';
          if (profile.socials) {
            const ig = document.getElementById('edit-social-instagram');
            if (ig) ig.value = profile.socials.instagram || '';
            const dc = document.getElementById('edit-social-discord');
            if (dc) dc.value = profile.socials.discord || '';
            const wa = document.getElementById('edit-social-whatsapp');
            if (wa) wa.value = profile.socials.whatsapp || '';
            const fb = document.getElementById('edit-social-facebook');
            if (fb) fb.value = profile.socials.facebook || '';
            const tt = document.getElementById('edit-social-tiktok');
            if (tt) tt.value = profile.socials.tiktok || '';
          }
        }

        const socialsContainer = document.getElementById('profile-socials');
        if (socialsContainer) {
          socialsContainer.innerHTML = '';
          if (profile.socials) {
            const s = profile.socials;
            if (s.instagram) socialsContainer.innerHTML += `<a href="https://instagram.com/${s.instagram.replace('@','')}" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-lg bg-pink-500/10 text-pink-500 hover:bg-pink-500 hover:text-white transition-all"><i class="fab fa-instagram"></i></a>`;
            if (s.discord) socialsContainer.innerHTML += `<a href="${s.discord.startsWith('http') ? s.discord : '#'}" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-lg bg-indigo-500/10 text-indigo-400 hover:bg-indigo-500 hover:text-white transition-all"><i class="fab fa-discord"></i></a>`;
            if (s.whatsapp) socialsContainer.innerHTML += `<a href="https://wa.me/${s.whatsapp.replace(/\+/g,'')}" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-lg bg-green-500/10 text-green-500 hover:bg-green-500 hover:text-white transition-all"><i class="fab fa-whatsapp"></i></a>`;
            if (s.facebook) socialsContainer.innerHTML += `<a href="${s.facebook.startsWith('http') ? s.facebook : `https://facebook.com/${s.facebook}`}" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-lg bg-blue-600/10 text-blue-600 hover:bg-blue-600 hover:text-white transition-all"><i class="fab fa-facebook"></i></a>`;
            if (s.tiktok) socialsContainer.innerHTML += `<a href="https://tiktok.com/@${s.tiktok.replace('@','')}" target="_blank" class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-500/10 text-white hover:bg-white hover:text-black transition-all"><i class="fab fa-tiktok"></i></a>`;
          }
        }
        
        try { renderUserPosts(posts.filter(p => !p.isContest)); } catch(e) { console.error('Error in renderUserPosts:', e); }
        try { renderUserConcursos(posts.filter(p => p.isContest)); } catch(e) { console.error('Error in renderUserConcursos:', e); }
        try { renderUserRecursos(recursos); } catch(e) { console.error('Error in renderUserRecursos:', e); }
        try { renderUserEventos(eventos, isOwner ? doorEvents : []); } catch(e) { console.error('Error in renderUserEventos:', e); }
        try { renderUserOportunidades(oportunidades); } catch(e) { console.error('Error in renderUserOportunidades:', e); }
        try { renderUserVisualEffects(visualeffects); } catch(e) { console.error('Error in renderUserVisualEffects:', e); }
        try { renderUserFavorites(favorites); } catch(e) { console.error('Error in renderUserFavorites:', e); }

        // Actualizar badges con conteos de cada pestaña
        const setBadge = (id, count) => {
          const el = document.getElementById(id);
          if (el) {
            el.textContent = count;
            if (count > 0) {
              el.classList.remove('hidden');
              el.style.display = 'inline-block';
            } else {
              el.classList.add('hidden');
              el.style.display = 'none';
            }
          }
        };
        const activePostsCount = posts.filter(p => !p.isContest).length;
        const contestPostsCount = posts.filter(p => p.isContest).length;
        const totalFavsCount = (favorites.posts?.length || 0) + (favorites.recursos?.length || 0) + (favorites.eventos?.length || 0) + (favorites.oportunidades?.length || 0);

        setBadge('badge-posts', activePostsCount);
        setBadge('badge-recursos', recursos.length);
        setBadge('badge-concursos', contestPostsCount);
        setBadge('badge-eventos', eventos.length);
        setBadge('badge-oportunidades', oportunidades.length);
        setBadge('badge-favs', totalFavsCount);
        setBadge('badge-visualeffects', visualeffects.length);

        // Si se especificó un tab por parámetro en URL (ej: ?tab=secuencias o ?tab=visualeffects), activarlo
        const tabParam = params.get('tab');
        if (tabParam) {
          const normalized = (tabParam === 'secuencias' || tabParam === 'visualeffect' || tabParam === 'efectos') ? 'visualeffects' : tabParam;
          if (document.getElementById('tab-' + normalized)) {
            switchTab(normalized);
          }
        }

        // XP level bar (shown for everyone)
        try { renderXPLevel(profile, posts, recursos, eventos); } catch(e) { console.error('Error in renderXPLevel:', e); }

        // Owner-only: completion widget + owner tabs
        if (isOwner) {
          try { renderProfileCompletion(profile, posts, recursos, eventos); } catch(e) { console.error('Error in renderProfileCompletion:', e); }
          try { loadUserTickets(); } catch(e) {}
          try { loadUserNotifications(); } catch(e) {}
        }
      } catch (err) {
        console.error("Error loading profile:", err);
        const nameEl = document.getElementById('profile-username');
        if (nameEl) nameEl.textContent = 'Usuario no encontrado';
      }
    }

    // ─── XP / Level System ────────────────────────────────────────────────────
    const XP_LEVELS = [
      { name: 'Observador',     min: 0,    max: 99,   color: 'from-gray-500 to-gray-400' },
      { name: 'Aprendiz',       min: 100,  max: 299,  color: 'from-green-600 to-green-400' },
      { name: 'Creador',        min: 300,  max: 699,  color: 'from-cyan-600 to-cyan-400' },
      { name: 'Artista',        min: 700,  max: 1499, color: 'from-blue-600 to-blue-400' },
      { name: 'Maestro',        min: 1500, max: 2999, color: 'from-fuchsia-600 to-fuchsia-400' },
      { name: 'Leyenda Digital',min: 3000, max: 9999, color: 'from-yellow-500 to-orange-400' },
    ];

    function calcXP(profile, posts, recursos, eventos) {
      let xp = 0;
      if (profile.bio && profile.bio.trim().length > 10) xp += 50;
      if (profile.avatar) xp += 50;
      if (profile.email) xp += 30;
      if (profile.displayName && profile.displayName !== profile.username) xp += 20;
      const socials = profile.socials || {};
      if (socials.instagram || socials.discord || socials.whatsapp || socials.facebook || socials.tiktok) xp += 30;
      xp += posts.length * 20;
      xp += recursos.length * 15;
      xp += eventos.length * 25;
      const totalLikes = posts.reduce((s, p) => s + (p.likes?.length || 0), 0)
                       + recursos.reduce((s, r) => s + (r.likes?.length || 0), 0)
                       + eventos.reduce((s, e) => s + (e.likes?.length || 0), 0);
      xp += totalLikes * 5;
      return xp;
    }

    function getLevelForXP(xp) {
      for (let i = XP_LEVELS.length - 1; i >= 0; i--) {
        if (xp >= XP_LEVELS[i].min) return { ...XP_LEVELS[i], index: i };
      }
      return { ...XP_LEVELS[0], index: 0 };
    }

    function renderXPLevel(profile, posts, recursos, eventos) {
      const bar = document.getElementById('xp-level-bar');
      if (!bar) return;
      const xp = calcXP(profile, posts, recursos, eventos);
      const level = getLevelForXP(xp);
      const nextLevel = XP_LEVELS[level.index + 1];
      const pct = nextLevel
        ? Math.min(100, Math.round(((xp - level.min) / (nextLevel.min - level.min)) * 100))
        : 100;

      document.getElementById('xp-level-label').textContent = `NIVEL ${level.index + 1}`;
      document.getElementById('xp-points-label').textContent = `${xp} XP`;
      const fill = document.getElementById('xp-bar-fill');
      setTimeout(() => { fill.style.width = pct + '%'; }, 50);
      bar.classList.remove('hidden');
    }

    // ─── Profile Completion Widget ─────────────────────────────────────────────
    function renderProfileCompletion(profile, posts, recursos, eventos) {
      const hasContent = posts.length > 0 || recursos.length > 0 || eventos.length > 0;
      const tasks = [
        {
          done: !!(profile.bio && profile.bio.trim().length > 10),
          label: 'Escribir bio',
          icon: 'fa-align-left',
          action: "toggleEditMode()",
        },
        {
          done: !!profile.avatar,
          label: 'Foto de perfil',
          icon: 'fa-camera',
          action: "toggleEditMode()",
        },
        {
          done: !!profile.email,
          label: 'Email verificado',
          icon: 'fa-envelope',
          action: null,
        },
        {
          done: hasContent,
          label: 'Primera publicación',
          icon: 'fa-palette',
          action: `window.location.href='create'`,
        },
      ];

      const pending = tasks.filter(t => !t.done);
      if (!pending.length) {
        document.getElementById('profile-completion-widget').classList.add('hidden');
        return;
      }

      const completedCount = tasks.filter(t => t.done).length;
      const pct = Math.round((completedCount / tasks.length) * 100);
      document.getElementById('completion-bar').style.width = pct + '%';

      document.getElementById('completion-tasks').innerHTML = pending.map(t => `
        <button
          ${t.action ? `onclick="${t.action}"` : ''}
          class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-yellow-500/20 bg-yellow-500/5 text-yellow-400 hover:bg-yellow-500/15 transition-all text-xs font-bold ${!t.action ? 'opacity-60 cursor-default' : ''}">
          <i class="fas ${t.icon} text-[10px]"></i>
          ${t.label}
          <i class="fas fa-arrow-right text-[8px] opacity-60"></i>
        </button>`).join('');

      document.getElementById('profile-completion-widget').classList.remove('hidden');
    }

    function switchTab(tab) {
      UI.setActiveTab(document.querySelectorAll('.tab-btn'), document.getElementById('tab-' + tab), 'underline');
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById('section-' + tab).classList.remove('hidden');
    }

    function renderUserPosts(posts) {
      const container = document.getElementById('user-posts');
      if (!posts.length) {
        container.innerHTML = UI.EmptyState({ icon: 'fas fa-image', message: 'Este artista aún no tiene obras publicadas', accent: 'fuchsia', size: 'sm' });
        return;
      }
      const canEdit = isLoggedIn() && (isOwner || isAdmin());
      container.innerHTML = posts.map(p => UI.PostCard({ post: p, variant: 'profile', youtubeId: extractYouTubeId(p), canEdit })).join('');
    }

    function renderUserConcursos(contestPosts) {
      const container = document.getElementById('user-concursos');
      if (!contestPosts.length) {
        container.innerHTML = UI.EmptyState({
          icon: 'fas fa-trophy', message: 'Aún no participaste en ningún concurso', accent: 'yellow', size: 'sm', surface: 'dashed',
          action: UI.html`<a href="concurso" class="text-yellow-500 hover:text-yellow-400 text-sm font-bold block mt-2">¡Participar ahora!</a>`,
        });
        return;
      }
      container.innerHTML = contestPosts.map(p => UI.PostCard({ post: p, variant: 'contest' })).join('');
    }

    function renderUserRecursos(recursos) {
      const container = document.getElementById('user-recursos');
      if (!recursos.length) {
        container.innerHTML = UI.EmptyState({ icon: 'fas fa-box-open', message: 'Este usuario aún no tiene recursos compartidos', accent: 'orange', size: 'sm' });
        return;
      }
      const canEdit = isLoggedIn() && (isOwner || isAdmin());
      container.innerHTML = recursos.map(r => UI.RecursoCard({ recurso: r, variant: 'profile', youtubeId: extractYouTubeId(r), canEdit })).join('');
    }

    function renderUserEventos(eventos, doorEvents) {
      if (typeof window.renderUserEventos === 'function' && window.renderUserEventos !== renderUserEventos) {
        window.renderUserEventos(eventos, doorEvents);
        return;
      }
      const container = document.getElementById('user-eventos');
      const hasDoorEvents = doorEvents && doorEvents.length > 0;
      const hasOwnEvents = eventos && eventos.length > 0;
      if (!hasOwnEvents && !hasDoorEvents) {
        container.innerHTML = UI.EmptyState({ icon: 'fas fa-calendar-times', message: 'Este usuario no tiene eventos registrados', accent: 'magenta', size: 'sm' });
        return;
      }
      let html = '';
      if (hasOwnEvents) {
        if (hasDoorEvents) html += `<div class="col-span-full mb-2"><h3 class="ui-eyebrow ui-eyebrow--section flex items-center gap-2"><i class="fas fa-calendar-alt text-magenta-500"></i>Mis Eventos</h3></div>`;
        html += eventos.map(ev => renderEventoCardInline(ev, false)).join('');
      }
      if (hasDoorEvents) {
        html += `<div class="col-span-full mt-6 mb-2"><h3 class="ui-eyebrow ui-eyebrow--section flex items-center gap-2"><i class="fas fa-door-open text-cyan-500"></i>Control de Acceso / Puerta</h3><p class="text-xs text-gray-600 mt-1">Eventos donde podés escanear y canjear entradas</p></div>`;
        html += doorEvents.map(ev => renderEventoCardInline(ev, true)).join('');
      }
      container.innerHTML = html;
    }

    function renderEventoCardInline(ev, isDoorEvent) {
      return UI.EventoCard({
        evento: ev, variant: 'profile', youtubeId: extractYouTubeId(ev), isDoorEvent,
        canEdit: isLoggedIn() && (isOwner || isAdmin()),
      });
    }

    function renderUserFavorites(favs) {
      const container = document.getElementById('user-favs');
      const allFavs = [
          ...favs.posts.map(p => ({ ...p, type: 'post' })),
          ...favs.recursos.map(r => ({ ...r, type: 'recurso' })),
          ...favs.eventos.map(e => ({ ...e, type: 'evento' }))
      ].sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
      if (!allFavs.length) {
        container.innerHTML = UI.EmptyState({ icon: 'fas fa-heart-broken', message: 'Aún no hay favoritos guardados', accent: 'neutral', size: 'sm', surface: 'dashed' });
        return;
      }
      container.innerHTML = allFavs.map(item => UI.FavoriteCard({ item, youtubeId: extractYouTubeId(item) })).join('');
    }

    function renderUserOportunidades(oportunidades) {
      const container = document.getElementById('user-oportunidades');
      if (!container) return;
      if (!oportunidades.length) {
        container.innerHTML = UI.EmptyState({ icon: 'fas fa-briefcase', message: 'Este usuario aún no tiene oportunidades publicadas', accent: 'emerald', size: 'sm' });
        return;
      }
      const tipoLabels = { convocatoria_obra: 'Convocatoria de Obra', oportunidad_laboral: 'Oportunidad Laboral', colaboracion: 'Colaboración' };
      const tipoIcons = { convocatoria_obra: 'fas fa-palette', oportunidad_laboral: 'fas fa-briefcase', colaboracion: 'fas fa-handshake' };
      const canEdit = isLoggedIn() && (isOwner || isAdmin());
      container.innerHTML = oportunidades.map(opo => UI.OportunidadCard({
        oportunidad: opo, variant: 'profile', canEdit,
        typeLabel: tipoLabels[opo.tipo] || 'Oportunidad', typeIcon: tipoIcons[opo.tipo] || 'fas fa-briefcase',
      })).join('');
    }

    function renderUserVisualEffects(effects) {
      const container = document.getElementById('user-visualeffects');
      if (!container) return;
      if (!effects || !effects.length) {
        container.innerHTML = UI.EmptyState({
          icon: 'fas fa-wand-magic-sparkles', message: 'No hay secuencias guardadas aún.', size: 'sm',
          action: UI.html`<a href="visualeffects.html" class="inline-block mt-3 px-4 py-2 bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded-lg text-xs font-bold hover:bg-cyan-500/30 transition-all">
              <i class="fas fa-plus mr-1"></i> Crear primera secuencia
            </a>`,
        });
        return;
      }
      const canEdit = isLoggedIn() && (isOwner || isAdmin());
      container.innerHTML = effects.map(fx => UI.VisualEffectCard({ effect: fx, canEdit })).join('');
    }

    async function deleteVisualEffect(id) {
      if (!confirm('¿Seguro que querés eliminar esta secuencia visual?')) return;
      try {
        const res = await apiRequest(`/visualeffects/${id}`, { method: 'DELETE' });
        if (res?.ok) {
          await loadProfile();
        } else {
          const err = await res?.json().catch(() => ({}));
          alert(err?.error || 'Error al eliminar');
        }
      } catch (err) {
        console.error(err);
        alert('Error al conectar con el servidor');
      }
    }

    async function deletePost(postId) {
      if (!confirm('¿Estás seguro de que querés eliminar esta obra?')) return;
      const res = await apiRequest(`/posts/${postId}`, { method: 'DELETE' });
      if (res?.ok) await loadProfile();
    }

    async function deleteRecurso(id) {
      if (!confirm('¿Estás seguro de que querés eliminar este recurso?')) return;
      const res = await apiRequest(`/recursos/${id}`, { method: 'DELETE' });
      if (res?.ok) await loadProfile();
    }

    async function deleteEvento(id) {
      if (!confirm('¿Estás seguro de que querés eliminar este evento?')) return;
      const res = await apiRequest(`/eventos/${id}`, { method: 'DELETE' });
      if (res?.ok) await loadProfile();
    }

    async function deleteOportunidad(id) {
      if (!confirm('¿Estás seguro de que querés eliminar esta oportunidad?')) return;
      const res = await apiRequest(`/oportunidades/${id}`, { method: 'DELETE' });
      if (res?.ok) await loadProfile();
    }

    // Load user tickets
    async function loadUserTickets() {
      try {
        const res = await apiRequest('/tickets/my');
        if (!res) {
          throw new Error('No response from server');
        }
        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ error: 'Unknown error' }));
          console.error('[Tickets] Server error:', errorData);
          throw new Error(errorData.error || `HTTP ${res.status}`);
        }
        const tickets = await res.json();
        renderUserTickets(tickets);
      } catch (err) {
        console.error('Error loading tickets:', err);
        document.getElementById('user-tickets').innerHTML = `
          <div class="text-center text-gray-500 py-10">
            <i class="fas fa-exclamation-circle text-4xl text-red-400/30 mb-3"></i>
            <p>Error al cargar entradas</p>
            <p class="text-xs text-red-400 mt-2">${err.message}</p>
          </div>
        `;
      }
    }

    // Render user tickets
    function renderUserTickets(tickets) {
      const container = document.getElementById('user-tickets');

      if (!tickets.length) {
        container.innerHTML = `
          <div class="text-center text-gray-500 py-16 bg-white/5 rounded-3xl border border-dashed border-white/10">
            <i class="fas fa-ticket-alt text-4xl text-fuchsia-400/30 mb-3"></i>
            <p class="mb-2">No tenés entradas todavía</p>
            <a href="calendario" class="text-fuchsia-400 hover:text-fuchsia-300 text-sm">
              <i class="fas fa-calendar mr-1"></i>Ver eventos disponibles
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = tickets.map(t => UI.TicketCard({
        ticket: t, mapsUrl: t.event?.location && getGoogleMapsUrl(t.event.location),
      })).join('');
    }

    // Download ticket QR
    function downloadTicketQR(code) {
      window.open(`ticket-success?ticket=${code}`, '_blank');
    }

    function toggleEditMode() {
      document.getElementById('edit-form').classList.toggle('hidden');
    }

    // --- EDIT MODALS LOGIC ---
    function openEditPost(id) { loadItemToEdit('posts', id); }
    function openEditRecurso(id) { loadItemToEdit('recursos', id); }
    function openEditEvento(id) { loadItemToEdit('eventos', id); }

    function closeGlobalEdit() {
      const modal = document.getElementById('global-edit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  </script>

  <!-- Global Edit Modal -->
  <script>document.currentScript.outerHTML = UI.EditModal();</script>
