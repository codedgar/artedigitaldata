<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recurso - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <script src="js/config.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/avatar.js"></script>
  <script src="js/ui/badge.js"></script>
  <script src="js/ui/button.js"></script>
  <script src="js/ui/card.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/ui/heading.js"></script>
  <script src="js/ui/media.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/state.js"></script>
  <script src="js/ui/tabs.js"></script>
</head>
<body class="min-h-screen">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
  <div id="app-header"></div>

  <main class="relative z-10 pt-24 pb-12 max-w-4xl mx-auto px-4">
    <div id="resource-content" class="hidden">
      <div class="card-cyber ui-panel ui-panel--detail-padded">
        <div class="flex items-center gap-6 mb-8">
          <div id="resource-type-icon" class="w-20 h-20 rounded-2xl flex items-center justify-center text-4xl shrink-0">
            <!-- Icon will be injected here -->
          </div>
          <div class="flex-1 min-w-0">
            <h1 id="resource-title" class="ui-title ui-title--page-lg mb-2 truncate"></h1>
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-2">
                <div id="author-avatar" class="w-8 h-8 rounded-full overflow-hidden bg-white/5 border border-white/10 flex items-center justify-center text-xs font-bold text-cyan-400">
                  <!-- Avatar injected here -->
                </div>
                <p class="text-gray-500 font-medium whitespace-nowrap">Subido por <a id="resource-author" href="#" class="text-cyan-400 hover:underline"></a></p>
              </div>
              <button id="like-btn" class="flex items-center gap-2 px-3 py-1 rounded-lg border border-white/10 hover:bg-white/5 transition-all text-sm">
                <i class="far fa-heart"></i>
                <span id="like-count" class="font-bold">0</span>
              </button>
            </div>
          </div>
        </div>

        <div id="resource-image-container" class="hidden mb-8 rounded-2xl overflow-hidden border border-white/5 aspect-video">
           <img id="resource-image" src="" class="w-full h-full object-cover">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
          <div class="md:col-span-2 prose prose-invert max-w-none">
            <h3 class="ui-title ui-title--section mb-4 border-l-4 border-cyan-500 pl-4">Descripción</h3>
            <p id="resource-description" class="text-gray-300 leading-relaxed whitespace-pre-line"></p>
            
            <div id="resource-tags" class="flex flex-wrap gap-2 mt-6">
              <!-- Tags here -->
            </div>
          </div>
          <div class="flex flex-col gap-4">
            <a id="resource-link" href="#" target="_blank" rel="noopener" class="flex items-center justify-center gap-3 px-6 py-4 rounded-2xl bg-cyan-500 text-black font-black hover:scale-105 transition-all">
              <i class="fas fa-external-link-alt"></i>
              ABRIR RECURSO
            </a>
            <div class="p-4 rounded-2xl bg-white/5 border border-white/5 text-center">
              <h4 class="ui-eyebrow ui-eyebrow--field mb-1">Tipo</h4>
              <p id="resource-type-text" class="text-white font-bold uppercase tracking-widest text-sm"></p>
            </div>
          </div>
        </div>

        <!-- Comments Section -->
        <div class="border-t border-white/10 pt-8 mt-10">
          <h3 class="ui-title ui-title--section mb-6">
            <i class="fas fa-comments text-cyan-400 mr-2"></i>Comentarios (<span id="comment-count">0</span>)
          </h3>
          
          <div id="comment-form-container" class="mb-8">
            <!-- Form will be injected here -->
          </div>

          <div id="comments-list" class="space-y-6">
            <!-- Comments will be injected here -->
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <script>document.currentScript.outerHTML = UI.PageLoader({ id: 'loading', message: 'Cargando recurso...', accent: 'cyan-deep' });</script>

    <!-- Error State -->
    <div id="error" class="hidden py-20 text-center">
      <i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-6"></i>
      <h2 class="ui-title ui-title--panel mb-2">Recurso no encontrado</h2>
      <a href="recursos.html" class="btn-primary mt-4 inline-block ui-btn ui-btn--primary-lg">Volver a Recursos</a>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script src="js/tagging.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/edit-logic.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script>
    let currentResourceId = null;
    const typeIcons = { software: 'fas fa-desktop', github: 'fab fa-github', drive: 'fab fa-google-drive', tutorial: 'fas fa-graduation-cap', other: 'fas fa-link' };
    const typeColors = { software: 'bg-fuchsia-500/20 text-fuchsia-400', github: 'bg-gray-500/20 text-gray-400', drive: 'bg-yellow-500/20 text-yellow-500', tutorial: 'bg-green-500/20 text-green-400', other: 'bg-orange-500/20 text-orange-400' };

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentResourceId = urlParams.get('id');

      if (!currentResourceId) {
        showError();
        return;
      }

      await loadResource();
    });

    async function loadResource() {
      try {
        const res = await fetch(`${CONFIG.API_URL}/recursos/${currentResourceId}`);
        if (!res.ok) throw new Error();
        const r = await res.json();
        renderResource(r);
      } catch (err) {
        showError();
      }
    }

    function renderResource(r) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('resource-content').classList.remove('hidden');

      const isAuthor = isLoggedIn() && getUserId() === r.author?._id;

      document.title = `${r.title} - Arte Digital Data`;
      document.getElementById('resource-title').innerText = r.title;
      document.getElementById('resource-description').innerHTML = formatMentions(r.description) || 'Sin descripción disponible.';
      document.getElementById('resource-type-text').innerText = r.type;

      // Icon and Author
      const authorLink = document.getElementById('resource-author');
      authorLink.innerText = `@${r.author?.username || 'anónimo'}`;
      authorLink.href = `profile.html?user=${encodeURIComponent(r.author?.username || '')}`;

      const avatarCont = document.getElementById('author-avatar');
      avatarCont.innerHTML = UI.AvatarContent({ name: r.author?.username, src: r.author?.avatar });

      // Edit Button
      if (isAuthor) {
          let editBtnContainer = document.getElementById('edit-btn-recurso');
          if (!editBtnContainer) {
              editBtnContainer = document.createElement('div');
              editBtnContainer.id = 'edit-btn-recurso';
              const actionFlex = document.querySelector('.flex.items-center.gap-4');
              if (actionFlex) actionFlex.appendChild(editBtnContainer);
          }
          editBtnContainer.innerHTML = `
            <button onclick="loadItemToEdit('recursos', '${r._id}', true)" class="flex items-center gap-2 px-4 py-2 rounded-xl border border-orange-500/30 text-orange-400 hover:bg-orange-500/10 transition-all font-bold text-sm">
              <i class="fas fa-edit"></i>
              <span>Editar</span>
            </button>
          `;
      }

      // YouTube and Link
      const youtubeId = extractYouTubeId(r);
      const imgContainer = document.getElementById('resource-image-container');
      const link = document.getElementById('resource-link');
      link.href = sanitizeUrl(r.url);

      if (r.imageUrl) {
        imgContainer.classList.remove('hidden');
        imgContainer.className = "mb-8 rounded-2xl overflow-hidden border border-white/5 aspect-video relative";
        imgContainer.innerHTML = `<img src="${sanitizeUrl(r.imageUrl)}" class="w-full h-full object-cover">`;
        if (youtubeId) {
          imgContainer.setAttribute('onmouseenter', `playVideo(this, '${youtubeId}')`);
          imgContainer.setAttribute('onmouseleave', 'stopVideo(this)');
          imgContainer.innerHTML += UI.VideoOverlay();
        }
      } else {
        imgContainer.classList.add('hidden');
      }

      // YouTube Badge
      if (r.youtube_video) {
        let badge = document.getElementById('youtube-badge-recurso');
        if (!badge) {
            badge = document.createElement('div');
            badge.id = 'youtube-badge-recurso';
            badge.className = "mb-6";
            document.getElementById('resource-description').after(badge);
        }
        badge.innerHTML = `
          <a href="${sanitizeUrl(r.youtube_video)}" target="_blank" class="inline-flex items-center gap-2 ui-btn ui-btn--video">
            <i class="fab fa-youtube text-lg"></i> Ver Tutorial / Video
          </a>
        `;
      } else {
        const badge = document.getElementById('youtube-badge-recurso');
        if (badge) badge.remove();
      }

      const iconContainer = document.getElementById('resource-type-icon');
      iconContainer.className = `w-20 h-20 rounded-2xl flex items-center justify-center text-4xl shrink-0 ${typeColors[r.type] || typeColors.other}`;
      iconContainer.innerHTML = `<i class="${typeIcons[r.type] || typeIcons.other}"></i>`;

      const tagsContainer = document.getElementById('resource-tags');
      tagsContainer.innerHTML = (r.tags || []).map(t => `<span class="px-3 py-1 bg-cyan-500/10 text-cyan-400 rounded-lg text-xs font-bold">#${escapeHTML(t)}</span>`).join('');

      // Likes
      const btn = document.getElementById('like-btn');
      const count = document.getElementById('like-count');
      const isLiked = r.likes?.includes(getUserId());
      btn.className = `flex items-center gap-2 px-3 py-1 rounded-lg border border-white/10 hover:bg-white/5 transition-all text-sm ${isLiked ? 'text-red-500' : 'text-gray-400'}`;
      btn.querySelector('i').className = `${isLiked ? 'fas' : 'far'} fa-heart`;
      count.innerText = r.likes?.length || 0;
      btn.onclick = () => toggleLike();

      // Comments
      document.getElementById('comment-count').innerText = r.comments?.length || 0;
      const formContainer = document.getElementById('comment-form-container');
      if (isLoggedIn()) {
        formContainer.innerHTML = `
          <form id="comment-form" class="group">
            <div class="flex gap-4">
              <div class="w-10 h-10 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400 shrink-0">
                <i class="fas fa-comment-dots"></i>
              </div>
              <div class="flex-1">
                <textarea id="comment-text" required placeholder="Duda, agradecimiento o comentario sobre este recurso..." 
                  class="ui-textarea ui-textarea--comment ui-textarea--focus-cyan"></textarea>
                <div class="flex justify-end mt-2">
                  <button type="submit" class="btn-primary ui-btn ui-btn--primary-sm">
                    Comentar
                  </button>
                </div>
              </div>
            </div>
          </form>`;
        document.getElementById('comment-form').addEventListener('submit', addComment);
      } else {
        formContainer.innerHTML = `<div class="bg-white/5 border border-white/5 rounded-2xl p-6 text-center text-gray-500 text-sm">Debes <button onclick="showLogin()" class="ui-btn ui-btn--link">iniciar sesión</button> para comentar.</div>`;
      }

      const commentsList = document.getElementById('comments-list');
      commentsList.innerHTML = (r.comments || []).map(c => {
        const isCommentOwner = isLoggedIn() && (getUserId() === c.user?._id || isAdmin());
        return `
        <div class="flex gap-4">
          ${UI.Avatar({ src: c.user?.avatar, icon: 'fas fa-user', variant: 'commenter', size: '2xl' })}
          <div class="flex-1">
            <div class="bg-white/5 rounded-2xl px-4 py-3">
              <div class="flex justify-between items-center mb-1">
                <a href="profile.html?user=${encodeURIComponent(c.user?.username || '')}" class="font-bold text-cyan-400 text-sm hover:underline">@${escapeHTML(c.user?.username || 'Anónimo')}</a>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] text-gray-500">${new Date(c.createdAt).toLocaleDateString()}</span>
                  ${isCommentOwner ? `
                    <button onclick="deleteComment('${c._id}')" class="ui-btn ui-btn--comment-delete" title="Borrar comentario">
                      <i class="fas fa-trash"></i>
                    </button>
                  ` : ''}
                </div>
              </div>
              <p class="text-gray-300 text-sm">${formatMentions(c.text)}</p>
            </div>
          </div>
        </div>
      `;}).reverse().join('') || UI.StatusText({ variant: 'comments', message: 'No hay comentarios aún.' });
    }

    async function deleteComment(commentId) {
      if (!confirm('¿Eliminar este comentario?')) return;
      try {
        const res = await apiRequest(`/recursos/${currentResourceId}/comment/${commentId}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          await loadResource();
        }
      } catch (err) {
        alert('Error al eliminar comentario');
      }
    }

    async function addComment(e) {
      e.preventDefault();
      const textInput = document.getElementById('comment-text');
      const text = textInput.value.trim();
      if (!text) return;

      try {
        const res = await apiRequest(`/recursos/${currentResourceId}/comment`, {
          method: 'POST',
          body: JSON.stringify({ text })
        });

        if (res.ok) {
          textInput.value = '';
          await loadResource();
        }
      } catch (err) {
        alert('Error al publicar comentario');
      }
    }

    async function toggleLike() {
      if (!isLoggedIn()) {
        alert('Debes iniciar sesión para dar like');
        return;
      }
      
      try {
        const res = await apiRequest(`/recursos/${currentResourceId}/like`, { method: 'POST' });
        if (res.ok) {
          const r = await res.json();
          const btn = document.getElementById('like-btn');
          const count = document.getElementById('like-count');
          const isLiked = r.likes.includes(getUserId());
          
          btn.className = `flex items-center gap-2 px-3 py-1 rounded-lg border border-white/10 hover:bg-white/5 transition-all text-sm ${isLiked ? 'text-red-500' : 'text-gray-400'}`;
          btn.querySelector('i').className = `${isLiked ? 'fas' : 'far'} fa-heart`;
          count.innerText = r.likes.length;
        }
      } catch (err) {
        console.error(err);
      }
    }

    function showError() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }
  </script>
  <!-- Global Edit Modal -->
  <script>document.currentScript.outerHTML = UI.EditModal();</script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
</body>
</html>
