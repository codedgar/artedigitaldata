<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursos - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <script src="js/config.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/avatar.js"></script>
  <script src="js/ui/badge.js"></script>
  <script src="js/ui/button.js"></script>
  <script src="js/ui/card.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/ui/heading.js"></script>
  <script src="js/ui/media.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/state.js"></script>
  <script src="js/ui/tabs.js"></script>
</head>
<body class="min-h-screen">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
  <div id="app-header"></div>

  <main class="relative z-10 pt-20 pb-10 max-w-7xl mx-auto px-4">
    <section id="page-header" class="mb-10"></section>
    <script>document.getElementById('page-header').innerHTML = UI.PageHeader({ icon: 'fas fa-box-open', title: 'Repositorio de Recursos', subtitle: 'Software, links de GitHub, tutoriales y más para artistas digitales.' });</script>

    <!-- Filter Buttons -->
    <div class="flex flex-wrap gap-2 mb-8">
      <script>document.currentScript.outerHTML = UI.Tabs({ variant: 'filter', onSelect: 'filterRecursos', active: 'all', items: [
        { key: 'all', label: 'Todos' },
        { key: 'software', label: 'Software' },
        { key: 'github', label: 'GitHub' },
        { key: 'drive', label: 'Drive' },
        { key: 'tutorial', label: 'Tutoriales' },
        { key: 'texto', label: 'Textos' },
      ] });</script>
    </div>

    <!-- Recursos Grid -->
    <div id="recursos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <script>document.getElementById('recursos-container').innerHTML = UI.LoadingState({ message: 'Cargando recursos...' });</script>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script src="js/tagging.js"></script>
  <script>
    let allRecursos = [];
    const typeIcons = { software: 'fas fa-desktop', github: 'fab fa-github', drive: 'fab fa-google-drive', tutorial: 'fas fa-graduation-cap', texto: 'fas fa-file-alt', other: 'fas fa-link' };
    const typeColors = { software: 'fuchsia', github: 'gray', drive: 'yellow', tutorial: 'green', texto: 'cyan', other: 'orange' };

    document.addEventListener('DOMContentLoaded', async () => {
      await loadRecursos();
    });

    async function loadRecursos() {
      const container = document.getElementById('recursos-container');
      try {
        const res = await fetch(CONFIG.API_URL + '/recursos');
        allRecursos = await res.json();
        renderRecursos(allRecursos);
      } catch {
        container.innerHTML = UI.ErrorState({ message: 'Error cargando recursos' });
      }
    }

    function filterRecursos(type) {
      UI.setActiveTab(document.querySelectorAll('.filter-btn'), event.target, 'filter');

      const filtered = type === 'all' ? allRecursos : allRecursos.filter(r => r.type === type);
      renderRecursos(filtered);
    }


    function renderRecursos(recursos) {
      const container = document.getElementById('recursos-container');
      if (!recursos.length) {
        container.innerHTML = UI.EmptyState({ icon: 'fas fa-folder-open', message: 'No hay recursos' });
        return;
      }

      container.innerHTML = recursos.map(r => UI.RecursoCard({
        recurso: r, variant: 'gallery', youtubeId: extractYouTubeId(r),
        typeIcon: typeIcons[r.type] || typeIcons.other, typeTone: typeColors[r.type] || typeColors.other,
      })).join('');
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
</body>
</html>
